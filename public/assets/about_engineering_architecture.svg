<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aboutGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#2997ff" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#2997ff" stopOpacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stopColor="#18181b"/>
      <stop offset="100%" stopColor="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#2997ff"/>
      <stop offset="100%" stopColor="#0071e3"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="24" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Subtle Architecture Grid -->
  <g opacity="0.12">
    <line x1="50" y1="0" x2="50" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="250" y1="0" x2="250" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="350" y1="0" x2="350" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="450" y1="0" x2="450" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="550" y1="0" x2="550" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="0" y1="50" x2="600" y2="50" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="450" x2="600" y2="450" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="550" x2="600" y2="550" stroke="#71717a" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Energy Glow -->
  <circle cx="300" cy="300" r="180" fill="url(#aboutGlow)"/>

  <!-- Orbital Ring -->
  <circle cx="300" cy="300" r="170" stroke="#3f3f46" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="300" cy="300" r="110" stroke="#2997ff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Workflow Connection Lines -->
  <line x1="300" y1="130" x2="300" y2="240" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="470" y1="300" x2="360" y2="300" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="300" y1="470" x2="300" y2="360" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="130" y1="300" x2="240" y2="300" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.5"/>

  <line x1="180" y1="180" x2="255" y2="255" stroke="#71717a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="420" y1="420" x2="345" y2="345" stroke="#71717a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="420" y1="180" x2="345" y2="255" stroke="#71717a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="180" y1="420" x2="255" y2="345" stroke="#71717a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Central Orchestrator Core -->
  <rect x="240" y="240" width="120" height="120" rx="20" fill="#18181b" stroke="#2997ff" stroke-width="2"/>
  <circle cx="300" cy="285" r="16" fill="url(#primaryGrad)"/>
  <path d="M294 285L298 289L306 281" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="325" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em">ORCHESTRATOR</text>
  <text x="300" y="340" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">CALMSTACKS CORE</text>

  <!-- Node 1: Requirements & Planning (Top) -->
  <g transform="translate(230, 80)">
    <rect width="140" height="52" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="24" cy="26" r="6" fill="#10b981"/>
    <text x="40" y="23" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Product Planning</text>
    <text x="40" y="37" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Specs &amp; Contracts</text>
  </g>

  <!-- Node 2: System Architecture (Top Right) -->
  <g transform="translate(420, 150)">
    <rect width="130" height="50" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="22" cy="25" r="5" fill="#2997ff"/>
    <text x="36" y="22" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Architecture</text>
    <text x="36" y="36" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Technical Design</text>
  </g>

  <!-- Node 3: Full-Stack Implementation (Right) -->
  <g transform="translate(440, 275)">
    <rect width="135" height="52" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="22" cy="26" r="5" fill="#a855f7"/>
    <text x="36" y="23" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Implementation</text>
    <text x="36" y="37" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Frontend &amp; Backend</text>
  </g>

  <!-- Node 4: Stage-Gate Validation & QA (Bottom) -->
  <g transform="translate(230, 465)">
    <rect width="140" height="52" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="24" cy="26" r="6" fill="#f59e0b"/>
    <text x="40" y="23" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Stage-Gate QA</text>
    <text x="40" y="37" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Security &amp; Testing</text>
  </g>

  <!-- Node 5: DevOps & Worktrees (Bottom Left) -->
  <g transform="translate(50, 400)">
    <rect width="140" height="50" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="22" cy="25" r="5" fill="#06b6d4"/>
    <text x="36" y="22" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Git Worktrees</text>
    <text x="36" y="36" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Isolated Execution</text>
  </g>

  <!-- Node 6: AI / ML Integration (Left) -->
  <g transform="translate(25, 275)">
    <rect width="135" height="52" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="22" cy="26" r="5" fill="#ec4899"/>
    <text x="36" y="23" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">AI / ML Engines</text>
    <text x="36" y="37" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="9">Model Pipelines</text>
  </g>

  <!-- Telemetry Badge Top-Left -->
  <rect x="25" y="25" width="130" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="37" cy="38" r="3.5" fill="#10b981"/>
  <text x="48" y="42" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="9" font-weight="500">SDLC ORCHESTRATION</text>

  <!-- Telemetry Badge Bottom-Right -->
  <rect x="445" y="550" width="130" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="510" y="567" fill="#2997ff" font-family="ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">CALMSTACKS v2.4</text>
</svg>
